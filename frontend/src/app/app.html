<div style="max-width: 500px; margin: 40px auto; font-family: sans-serif; text-align: center;">
  <h2>Gestor de Tareas Dinámico + Base de Datos H2 🗄️</h2>

  <div style="margin-bottom: 20px;">
    <input 
      #inputTarea 
      type="text" 
      placeholder="Escribe una nueva tarea..." 
      style="padding: 8px; width: 65%; margin-right: 8px;"
    />
    <button 
      (click)="agregar(inputTarea.value); inputTarea.value = ''" 
      style="padding: 8px 16px; background-color: #28a745; color: white; border: none; cursor: pointer;">
      Agregar
    </button>
  </div>

  <ul style="list-style: none; padding: 0;">
    @for (tarea of tareas(); track tarea.id) {
      <li style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd;">
        <span>{{ tarea.titulo }}</span>
        <button 
          (click)="eliminar(tarea.id)" 
          style="background-color: #dc3545; color: white; border: none; padding: 4px 8px; cursor: pointer;">
          ✕
        </button>
      </li>
    }
  </ul>
</div>
